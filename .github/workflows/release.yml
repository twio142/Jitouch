name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Jitouch.prefPane

      - name: Package
        run: zip -r Jitouch.prefPane.zip Jitouch.prefPane

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Jitouch.prefPane.zip
